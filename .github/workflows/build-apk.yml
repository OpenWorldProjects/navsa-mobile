name: Build and Release Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Setup Android SDK Environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew assembleDebug

      - name: Rename APK for release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./navsa-sarajevo-transit.apk
          cp android/app/build/outputs/apk/release/app-release.apk ./navsa-sarajevo-transit-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./navsa-sarajevo-transit-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: navsa-sarajevo-transit.apk
          path: ./navsa-sarajevo-transit.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./navsa-sarajevo-transit.apk
            ./navsa-sarajevo-transit-release.apk
            ./navsa-sarajevo-transit-debug.apk
          name: Sarajevo Transit Mobile Live Release v1.1.0
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
