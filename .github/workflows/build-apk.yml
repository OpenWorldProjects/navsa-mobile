name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/ || true

      - name: Setup Android SDK Environment
        run: |
          ANDROID_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$ANDROID_PATH" ]; then
            echo "sdk.dir=$ANDROID_PATH" > android/local.properties
          fi
          if [ -f android/local.properties ]; then
            cat android/local.properties
          fi

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew assembleDebug

      - name: Rename APK for release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./navsa-sarajevo-transit.apk
          cp android/app/build/outputs/apk/release/app-release.apk ./navsa-sarajevo-transit-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./navsa-sarajevo-transit-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: navsa-sarajevo-transit.apk
          path: ./navsa-sarajevo-transit.apk
